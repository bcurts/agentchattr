[server]
port = 8300
host = "127.0.0.1"
data_dir = "./data"

# Add agents here. Each gets a status pill, @mention routing, and color.
# "cwd" is the working directory for the agent's terminal session.
# "command" is the CLI command (must be on PATH).

[agents.claude]
command = "claude"
cwd = ".."
color = "#da7756"
label = "Claude"

[agents.codex]
command = "codex"
cwd = ".."
color = "#10a37f"
label = "Codex"

[agents.gemini]
command = "gemini"
cwd = ".."
color = "#4285f4"
label = "Gemini"

# Antigravity uses a fixed user settings file. The wrapper prevents concurrent
# launches from overwriting another Antigravity instance's chat identity.
[agents.antigravity]
command = "agy"
cwd = ".."
color = "#00bfa5"
label = "Antigravity"
mcp_inject = "settings_file"
mcp_settings_path = "~/.gemini/config/mcp_config.json"
mcp_transport = "http"
mcp_http_key = "serverURL"
# Keep project-specific tools out of this user-wide settings file.
mcp_merge_project = false

[agents.kimi]
command = "kimi"
cwd = ".."
color = "#1783ff"
label = "Kimi"

[agents.qwen]
command = "qwen"
cwd = ".."
color = "#8b5cf6"
label = "Qwen"
mcp_inject = "settings_file"
mcp_settings_path = ".qwen/settings.json"
mcp_transport = "http"
inject_delay = 1.0

[agents.kilo]
command = "kilo"
cwd = ".."
color = "#f7f677"
label = "Kilo"

[agents.codebuddy]
command = "codebuddy"
cwd = ".."
color = "#6C4DFF"
label = "CodeBuddy"
mcp_inject = "settings_file"
mcp_settings_path = "~/.codebuddy/.mcp.json"
mcp_transport = "http"
mcp_http_key = "url"

[agents.copilot]
command = "copilot"
cwd = ".."
color = "#8534F3"
label = "Copilot"
mcp_inject = "settings_file"
mcp_settings_path = "~/.copilot/mcp-config.json"
mcp_transport = "http"
mcp_http_key = "url"
enter_backend = "wm_setfocus"

[agents.opencode]
command = "opencode"
cwd = ".."
color = "#f97316"
label = "OpenCode"
# OpenCode's second launch mode is called "Auto" (not "Yolo"):
# --auto auto-approves everything inside the workdir while keeping
# external_directory denied. The launcher shows this label + description
# in the mode picker.
mode_label = "Auto"
mode_desc = "Auto 模式（工作目录内免确认，目录外直接拒绝）"

[agents.minimax]
type = "api"
base_url = "https://api.minimax.io/v1"
model = "MiniMax-M2.7"
color = "#2fe898"
label = "MiniMax"
api_key_env = "MINIMAX_API_KEY"
temperature = 1.0

# --- DeepSeek Harness (DSH) ---
# DSH runs through a dedicated adapter (wrapper_dsh.py) that speaks the
# `dsh --profile sdk` JSON-RPC protocol over stdio instead of injecting
# terminal keystrokes. One DSH subprocess is spawned per instance, each with
# its own DSH_HOME, profile, session store and logs.
#
# Reuses the installed @deepseek-ai/dsh package from your existing npx cache.
# Model/provider and the selected credential are copied from DSH Web into a
# private instance home. Original Web settings, sessions and credentials stay
# unchanged. Set provider/model explicitly only to override the Web selection.
# Optional overrides:
#   dsh_entry          — explicit npm package lib/bin.js (normally auto-detected)
#   node_path          — explicit node executable
#   provider / model   — override the Web model route
#   reasoning_effort   — optional reasoning effort hint
#   max_tokens         — optional output-token cap
#
# The launcher always shows this agent's mode as "完全访问" (full access):
# DSH runs with danger-full-access sandboxing and no approval prompts, so it
# can modify files and run commands unattended. Remove this block to disable
# DSH entirely — no existing data is migrated.
[agents.dsh]
command = "dsh"
cwd = ".."
color = "#4d6bfe"
label = "DeepSeek Harness"
mode_label = "完全访问"
mode_desc = "完全访问模式（免审批执行，可修改文件与运行命令）"

[routing]
# "none" = only route on explicit @mention. "all" = route to all agents by default.
default = "none"
max_agent_hops = 4

[mcp]
http_port = 8200
sse_port = 8201

[attachments]
# Ordinary files share images.upload_dir. Local agents need access to it.
max_size_mb = 25
allowed_extensions = ["*"]

[images]
upload_dir = "./uploads"
max_size_mb = 10

# --- MCP injection modes ---
# By default, claude/codex/gemini/kimi use built-in MCP config injection.
# For other CLI agents, set mcp_inject to tell the wrapper how to inject auth:
#
# mcp_inject modes:
#   "settings_file" — write a JSON settings file at mcp_settings_path (merges, not overwrites)
#   "env"           — write a settings file, expose path via mcp_env_var
#   "flag"          — write a config file, pass via CLI flag (mcp_flag, default: --mcp-config)
#   "proxy_flag"    — start a local proxy, pass URL via CLI flag template
#
# Example: Qwen Code CLI
#   [agents.qwen]
#   command = "qwen"
#   cwd = ".."
#   color = "#8b5cf6"
#   label = "Qwen"
#   mcp_inject = "settings_file"
#   mcp_settings_path = ".qwen/settings.json"
#   mcp_transport = "http"
#
# Example: CLI with env var for settings
#   [agents.mycli]
#   command = "mycli"
#   mcp_inject = "env"
#   mcp_env_var = "MYCLI_MCP_SETTINGS"
#   mcp_transport = "http"

# --- API agents (local models) ---
# Add local model agents in config.local.toml (gitignored).
# Example config.local.toml:
#
#   [agents.qwen]
#   type = "api"
#   base_url = "http://localhost:8189/v1"
#   model = "qwen3-4b"
#   color = "#8b5cf6"
#   label = "Qwen"
#   # api_key_env = "MY_API_KEY"     # optional: env var name for API key
#   # system_prompt = "You are ..."   # optional: custom system prompt
#
# Then run: python wrapper_api.py qwen
