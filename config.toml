[server]
port = 8300
host = "127.0.0.1"
data_dir = "./data"

# Add agents here. Each gets a status pill, @mention routing, and color.
# "cwd" is the working directory for the agent's terminal session.
# "command" is the CLI command (must be on PATH).

[agents.claude]
command = "claude"
cwd = ".."
color = "#da7756"
label = "Claude"

[agents.codex]
command = "codex"
cwd = ".."
color = "#10a37f"
label = "Codex"

[agents.gemini]
command = "gemini"
cwd = ".."
color = "#4285f4"
label = "Gemini"

# Grok Build CLI — native MCP in project .grok/config.toml as
# [mcp_servers.agentchattr] with url + bearer_token_env_var.
# Grok skips Claude/Cursor .mcp.json once the import marker is set.
# Launchers: start_grok.bat (Windows) / start_grok.sh (Mac/Linux). Official install:
#   Windows:   irm https://x.ai/cli/install.ps1 | iex   → %USERPROFILE%\.grok\bin
#   Mac/Linux: curl -fsSL https://x.ai/cli/install.sh | bash
[agents.grok]
command = "grok"
cwd = ".."
color = "#e5e5e5"
label = "Grok"

# Antigravity CLI (agy) — Google's agentic CLI, successor to the deprecated
# Gemini CLI. It reads MCP servers from ~/.gemini/config/mcp_config.json (a
# fixed path; no config-dir flag as of agy 1.1.7) and expects the HTTP URL under
# the key "serverURL" — plain "url"/"httpUrl" (the Gemini-CLI shape) are ignored.
# Verified against agy 1.1.7: this config makes agy connect and see all chat_* tools.
[agents.antigravity]
command = "agy"
cwd = ".."
color = "#00bfa5"
label = "Antigravity"
mcp_inject = "settings_file"
mcp_settings_path = "~/.gemini/config/mcp_config.json"
mcp_transport = "http"
mcp_http_key = "serverURL"
mcp_merge_project = true

[agents.kimi]
command = "kimi"
cwd = ".."
color = "#1783ff"
label = "Kimi"

[agents.qwen]
command = "qwen"
cwd = ".."
color = "#8b5cf6"
label = "Qwen"
mcp_inject = "settings_file"
mcp_settings_path = ".qwen/settings.json"
mcp_transport = "http"
inject_delay = 1.0

[agents.kilo]
command = "kilo"
cwd = ".."
color = "#f7f677"
label = "Kilo"

[agents.codebuddy]
command = "codebuddy"
cwd = ".."
color = "#6C4DFF"
label = "CodeBuddy"
mcp_inject = "settings_file"
mcp_settings_path = "~/.codebuddy/.mcp.json"
mcp_transport = "http"
mcp_http_key = "url"

[agents.copilot]
command = "copilot"
cwd = ".."
color = "#8534F3"
label = "Copilot"
mcp_inject = "settings_file"
mcp_settings_path = "~/.copilot/mcp-config.json"
mcp_transport = "http"
mcp_http_key = "url"
enter_backend = "wm_setfocus"

[agents.minimax]
type = "api"
base_url = "https://api.minimax.io/v1"
model = "MiniMax-M3"
color = "#2fe898"
label = "MiniMax"
api_key_env = "MINIMAX_API_KEY"
temperature = 1.0

[routing]
# "none" = only route on explicit @mention. "all" = route to all agents by default.
default = "none"
max_agent_hops = 4

[mcp]
http_port = 8200
sse_port = 8201

[images]
upload_dir = "./uploads"
max_size_mb = 10

# --- MCP injection modes ---
# By default, claude/codex/gemini/kimi/grok use built-in MCP config injection.
# For other CLI agents, set mcp_inject to tell the wrapper how to inject auth:
#
# mcp_inject modes:
#   "settings_file" — write a settings file at mcp_settings_path (merges, not overwrites)
#                     mcp_settings_format = "json" (default) or "grok_toml"
#   "env"           — write a settings file, expose path via mcp_env_var
#   "flag"          — write a config file, pass via CLI flag (mcp_flag, default: --mcp-config)
#   "proxy_flag"    — start a local proxy, pass URL via CLI flag template
#
# Example: Qwen Code CLI
#   [agents.qwen]
#   command = "qwen"
#   cwd = ".."
#   color = "#8b5cf6"
#   label = "Qwen"
#   mcp_inject = "settings_file"
#   mcp_settings_path = ".qwen/settings.json"
#   mcp_transport = "http"
#
# Example: CLI with env var for settings
#   [agents.mycli]
#   command = "mycli"
#   mcp_inject = "env"
#   mcp_env_var = "MYCLI_MCP_SETTINGS"
#   mcp_transport = "http"

# --- API agents (local models) ---
# Add local model agents in config.local.toml (gitignored).
# Example config.local.toml:
#
#   [agents.qwen]
#   type = "api"
#   base_url = "http://localhost:8189/v1"
#   model = "qwen3-4b"
#   color = "#8b5cf6"
#   label = "Qwen"
#   # api_key_env = "MY_API_KEY"     # optional: env var name for API key
#   # system_prompt = "You are ..."   # optional: custom system prompt
#
# Then run: python wrapper_api.py qwen
